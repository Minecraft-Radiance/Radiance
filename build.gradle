buildscript {
    repositories {
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.github.ReplayMod:preprocessor:master-SNAPSHOT'
    }
}

apply plugin: 'com.replaymod.preprocess'

preprocess {
    createNode('1.21.4', 12104, 'official').link(createNode('26.2', 260200, 'official'), null)
}
