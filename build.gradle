import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.util.Locale
import java.util.zip.ZipFile

plugins {
    id 'fabric-loom' version '1.16.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def profilerEnabled = providers.gradleProperty("radianceProfiler")
    .map { it.toBoolean() }
    .getOrElse(false)
def profilerSuffix = profilerEnabled ? "-profile" : ""
def uiBackend = providers.gradleProperty("radianceUiBackend")
    .map { it.toLowerCase(Locale.ROOT) }
    .getOrElse("opengl")
if (!["vulkan", "opengl"].contains(uiBackend)) {
    throw new GradleException("radianceUiBackend must be 'vulkan' or 'opengl', got '${uiBackend}'")
}
def openGLUiBackend = uiBackend == "opengl"
def vulkanUiBackend = uiBackend == "vulkan"
def operatingSystemName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def systemClassifier
if (operatingSystemName.contains("windows")) {
    systemClassifier = "windows"
} else if (operatingSystemName.contains("linux")) {
    systemClassifier = "linux"
} else {
    throw new GradleException("Unsupported operating system: ${System.getProperty('os.name')}")
}
def artifactBaseName = "${project.archives_base_name}-${project.version}${profilerSuffix}-fabric-${project.minecraft_version}-${systemClassifier}"
def nativeLibraryName = systemClassifier == "windows" ? "core.dll" : "libcore.so"
def nativeLibraryFile = file("src/main/resources/${nativeLibraryName}")
def nativeProfilerMarkers = [
    "Java_com_radiance_client_profiler_Profiler_nativeIsAvailable",
    "mcvr-profiler-jsonl",
    "texture_upload.frame.main_bytes"
]
def generatedProfilerSourceDir = layout.buildDirectory.dir("generated/sources/profiler/java")
def generatedUiBackendSourceDir = layout.buildDirectory.dir("generated/sources/uiBackend/java")
def generatedUiBackendResourceDir = layout.buildDirectory.dir("generated/resources/uiBackend")
def sourceMixinJsonFile = file("src/main/resources/radiance.mixins.json")
def nativeVulkanUiMarkers = [
    "Java_com_radiance_client_proxy_vulkan_ShaderProxy_registerShader",
    "UIModule",
    "registerOverlayDrawShader"
]
def nativeOpenGLUiMarkers = [
    "MCVR_UI_BACKEND_OPENGL",
    "OpenGLUiSurface",
    "Java_com_radiance_client_opengl_1ui_OpenGLUiProxy_prepareFrame",
    "Java_com_radiance_client_proxy_vulkan_RendererProxy_initRendererWithOpenGLDevice"
]

def openglExcludedMixins = [
    "vulkan_render_integration.AbstractTextureMixins",
    "vulkan_render_integration.BufferRendererMixins",
    "vulkan_render_integration.CompiledShaderMixins",
    "vulkan_render_integration.GameRendererMixins",
    "vulkan_render_integration.GLXMixins",
    "vulkan_render_integration.GlProgramManagerMixins",
    "vulkan_render_integration.GlStateManagerMixins",
    "vulkan_render_integration.GlUniformMixins",
    "vulkan_render_integration.MinecraftClientMixins",
    "vulkan_render_integration.NativeImageMixins",
    "vulkan_render_integration.ReloadableResourceManagerImplMixins",
    "vulkan_render_integration.RenderPhaseTargetMixins",
    "vulkan_render_integration.RenderSystemMixins",
    "vulkan_render_integration.ScreenshotRecorderMixins",
    "vulkan_render_integration.ScreenMixins",
    "vulkan_render_integration.ShaderLoaderMixins",
    "vulkan_render_integration.ShaderProgramMixins",
    "vulkan_render_integration.ShaderStageMixins",
    "vulkan_render_integration.TextureUtilMixins",
    "vulkan_render_integration.VideoWarningManagerWarningPatternLoaderMixins",
    "vulkan_render_integration.WindowMixins"
] as Set
def openglClientMixins = [
    "opengl_ui.OpenGLUiAbstractTextureMixins",
    "opengl_ui.OpenGLUiBufferRendererMixins",
    "opengl_ui.OpenGLUiGameRendererMixins",
    "opengl_ui.OpenGLUiMinecraftClientMixins",
    "opengl_ui.OpenGLUiNativeImageMixins",
    "opengl_ui.OpenGLUiRenderSystemMixins",
    "opengl_ui.OpenGLUiTextureUtilMixins",
    "opengl_ui.OpenGLUiWindowMixins"
]

tasks.register("generateProfilerBuildConfig") {
    inputs.property "radianceProfiler", profilerEnabled
    outputs.dir(generatedProfilerSourceDir)
    doLast {
        def packageDir = generatedProfilerSourceDir.get().dir("com/radiance/client/profiler").asFile
        packageDir.mkdirs()
        new File(packageDir, "ProfilerBuildConfig.java").text =
            "package com.radiance.client.profiler;\n\n" +
            "public final class ProfilerBuildConfig {\n" +
            "    public static final boolean ENABLED = ${profilerEnabled};\n\n" +
            "    private ProfilerBuildConfig() {\n" +
            "    }\n" +
            "}\n"
    }
}

tasks.register("generateUiBackendBuildConfig") {
    inputs.property "radianceUiBackend", uiBackend
    outputs.dir(generatedUiBackendSourceDir)
    doLast {
        def packageDir = generatedUiBackendSourceDir.get().dir("com/radiance/client/ui").asFile
        packageDir.mkdirs()
        new File(packageDir, "UiBackendBuildConfig.java").text =
            "package com.radiance.client.ui;\n\n" +
            "public final class UiBackendBuildConfig {\n" +
            "    public static final String BACKEND = \"${uiBackend}\";\n" +
            "    public static final boolean VULKAN_UI = ${vulkanUiBackend};\n" +
            "    public static final boolean OPENGL_UI = ${openGLUiBackend};\n\n" +
            "    private UiBackendBuildConfig() {\n" +
            "    }\n" +
            "}\n"

        new File(packageDir, "UiBackendRendererHooks.java").text =
            "package com.radiance.client.ui;\n\n" +
            "public final class UiBackendRendererHooks {\n" +
            "    public static void afterRendererInitialized() {\n" +
            (vulkanUiBackend
                ? "        com.radiance.client.proxy.vulkan.PipelineStateProxy.invalidateDynamicStateCache();\n"
                : "") +
            "    }\n\n" +
            "    private UiBackendRendererHooks() {\n" +
            "    }\n" +
            "}\n"
    }
}

tasks.register("generateUiBackendMixins") {
    inputs.file(sourceMixinJsonFile)
    inputs.property "radianceUiBackend", uiBackend
    outputs.dir(generatedUiBackendResourceDir)
    doLast {
        def json = new JsonSlurper().parse(sourceMixinJsonFile)
        if (openGLUiBackend) {
            json.mixins = json.mixins.findAll { !openglExcludedMixins.contains(it) }
            json.client = json.client.findAll { !openglExcludedMixins.contains(it) }
            json.client.addAll(openglClientMixins)
        }

        def outputDir = generatedUiBackendResourceDir.get().asFile
        outputDir.mkdirs()
        new File(outputDir, "radiance.mixins.json").text =
            JsonOutput.prettyPrint(JsonOutput.toJson(json)) + "\n"
    }
}

sourceSets {
    main {
        java {
            srcDir(generatedProfilerSourceDir)
            srcDir(generatedUiBackendSourceDir)
            if (openGLUiBackend) {
                exclude "com/radiance/client/proxy/vulkan/DrawCommandProxy.java"
                exclude "com/radiance/client/proxy/vulkan/PipelineStateProxy.java"
                exclude "com/radiance/client/proxy/vulkan/ShaderProxy.java"
                exclude "com/radiance/client/proxy/vulkan/VulkanUiProxy.java"
                exclude "com/radiance/client/shader/**"
                exclude "com/radiance/mixin_related/extensions/vulkan_render_integration/ICompiledShaderExt.java"
                exclude "com/radiance/mixin_related/extensions/vulkan_render_integration/IGlUniformExt.java"
                exclude "com/radiance/mixin_related/extensions/vulkan_render_integration/IShaderProgramExt.java"
                exclude "com/radiance/mixins/vulkan_render_integration/AbstractTextureMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/BufferRendererMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/CompiledShaderMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/GameRendererMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/GLXMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/GlProgramManagerMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/GlStateManagerMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/GlUniformMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/MinecraftClientMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/NativeImageMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/ReloadableResourceManagerImplMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/RenderPhaseTargetMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/RenderSystemMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/ScreenshotRecorderMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/ScreenMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/ShaderLoaderMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/ShaderProgramMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/ShaderStageMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/TextureUtilMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/VideoWarningManagerWarningPatternLoaderMixins.java"
                exclude "com/radiance/mixins/vulkan_render_integration/WindowMixins.java"
            } else {
                exclude "com/radiance/client/opengl_ui/**"
                exclude "com/radiance/mixins/opengl_ui/**"
            }
        }
        resources {
            srcDirs = []
            srcDir(generatedUiBackendResourceDir)
        }
    }
}

sourceSets {
    distantHorizons332 {
        compileClasspath += sourceSets.main.output
    }
    dhCompatibilityTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

configurations { distantHorizons331TestRuntime }

compileJava {
    dependsOn tasks.named("generateProfilerBuildConfig")
    dependsOn tasks.named("generateUiBackendBuildConfig")
    options.compilerArgs += ['-h', "${projectDir}/src/main/native/include"]
    outputs.upToDateWhen { false }
}

tasks.register("verifyNativeProfilerVariant") {
    inputs.file(nativeLibraryFile)
    doLast {
        if (!nativeLibraryFile.isFile()) {
            throw new GradleException("Native library is not installed: ${nativeLibraryFile}")
        }
        def nativeContents = new String(nativeLibraryFile.bytes,
            java.nio.charset.StandardCharsets.ISO_8859_1)
        def profilerMarkers = nativeProfilerMarkers.collect { nativeContents.contains(it) }
        def nativeProfilerEnabled = profilerMarkers.every { it }
        if ((!nativeProfilerEnabled && profilerMarkers.any { it })
            || nativeProfilerEnabled != profilerEnabled) {
            throw new GradleException(
                "Profiler variant mismatch: Java=${profilerEnabled}, Native=${nativeProfilerEnabled}"
            )
        }
    }
}

tasks.register("verifyNativeUiBackendVariant") {
    inputs.file(nativeLibraryFile)
    inputs.property "radianceUiBackend", uiBackend
    doLast {
        if (!nativeLibraryFile.isFile()) {
            throw new GradleException("Native library is not installed: ${nativeLibraryFile}")
        }
        def nativeContents = new String(nativeLibraryFile.bytes,
            java.nio.charset.StandardCharsets.ISO_8859_1)
        def hasAllVulkanUiMarkers = nativeVulkanUiMarkers.every { nativeContents.contains(it) }
        def hasAnyVulkanUiMarker = nativeVulkanUiMarkers.any { nativeContents.contains(it) }
        def hasAllOpenGLUiMarkers = nativeOpenGLUiMarkers.every { nativeContents.contains(it) }
        def hasAnyOpenGLUiMarker = nativeOpenGLUiMarkers.any { nativeContents.contains(it) }
        if (vulkanUiBackend && (!hasAllVulkanUiMarkers || hasAnyOpenGLUiMarker)) {
            throw new GradleException("Native UI backend mismatch: Java=vulkan, Native vulkan=${hasAllVulkanUiMarkers}, opengl=${hasAnyOpenGLUiMarker}")
        }
        if (openGLUiBackend && (!hasAllOpenGLUiMarkers || hasAnyVulkanUiMarker)) {
            throw new GradleException("Native UI backend mismatch: Java=opengl, Native vulkan=${hasAnyVulkanUiMarker}, opengl=${hasAllOpenGLUiMarkers}")
        }
    }
}

loom {
    mods {
        radiance {
            sourceSet sourceSets.main
            sourceSet sourceSets.distantHorizons332
        }
    }
    accessWidenerPath = file("src/main/resources/radiance.accesswidener")
