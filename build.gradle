tasks.register("verifyProfilerPackaging") {
    dependsOn tasks.named("remapJar")
    doLast {
        def outputJar = tasks.named("remapJar").get().archiveFile.get().asFile
        new ZipFile(outputJar).withCloseable { zip ->
            def expectedProfilerClasses = [
                "com/radiance/client/profiler/MemoryMetricsCollector.class",
                "com/radiance/client/profiler/Profiler.class",
                "com/radiance/client/profiler/ProfilerBuildConfig.class"
            ]
            def profilerEntries = zip.entries().findAll {
                it.name.startsWith("com/radiance/client/profiler/")
            }
            if (profilerEnabled && !expectedProfilerClasses.every { zip.getEntry(it) != null }) {
                throw new GradleException("Profile JAR does not contain all profiler classes")
            }
            if (!profilerEnabled && !profilerEntries.isEmpty()) {
                throw new GradleException("Release JAR contains profiler classes")
            }
            def referencedBy = zip.entries().findAll { entry ->
                if (!entry.name.endsWith(".class")
                    || entry.name.startsWith("com/radiance/client/profiler/")) {
                    return false
                }
                def bytes = zip.getInputStream(entry).bytes
                return new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    .contains("com/radiance/client/profiler/")
            }
            if (profilerEnabled && referencedBy.isEmpty()) {
                throw new GradleException("Profile JAR classes do not reference profiler code")
            }
            if (!profilerEnabled && !referencedBy.isEmpty()) {
                throw new GradleException("Release classes reference profiler code: ${referencedBy*.name}")
            }

            def mutableShaderSettingsEntries = zip.entries().findAll {
                it.name.endsWith(".zip.txt")
            }
            if (!mutableShaderSettingsEntries.isEmpty()) {
                throw new GradleException(
                    "JAR must not contain mutable shader settings: ${mutableShaderSettingsEntries*.name}"
                )
            }

            def nativeEntry = zip.getEntry(nativeLibraryName)
            if (nativeEntry == null) {
                throw new GradleException("JAR does not contain ${nativeLibraryName}")
            }
            def nativeContents = new String(zip.getInputStream(nativeEntry).bytes,
                java.nio.charset.StandardCharsets.ISO_8859_1)
            def nativeMarkers = nativeProfilerMarkers.collect { nativeContents.contains(it) }
            if ((profilerEnabled && !nativeMarkers.every { it })
                || (!profilerEnabled && nativeMarkers.any { it })) {
                throw new GradleException("Packaged native profiler variant does not match radianceProfiler=${profilerEnabled}")
            }
        }
    }
}

tasks.register("verifyUiBackendPackaging") {
    dependsOn tasks.named("remapJar")
    doLast {
        def outputJar = tasks.named("remapJar").get().archiveFile.get().asFile
        new ZipFile(outputJar).withCloseable { zip ->
            def entries = zip.entries().toList()
            def entryNames = entries.collect { it.name }
            def vulkanUiEntries = entryNames.findAll {
                it == "com/radiance/client/proxy/vulkan/VulkanUiProxy.class"
                    || it.startsWith("com/radiance/client/proxy/vulkan/ShaderProxy")
                    || it.startsWith("com/radiance/client/proxy/vulkan/PipelineStateProxy")
                    || it.startsWith("com/radiance/client/proxy/vulkan/DrawCommandProxy")
                    || it.startsWith("com/radiance/client/shader/")
            }
            def openglUiEntries = entryNames.findAll {
                it.startsWith("com/radiance/client/opengl_ui/")
                    || it.startsWith("com/radiance/mixins/opengl_ui/")
            }

            if (vulkanUiBackend) {
                if (!vulkanUiEntries.contains("com/radiance/client/proxy/vulkan/VulkanUiProxy.class")
                    || !entryNames.any { it.startsWith("com/radiance/client/proxy/vulkan/ShaderProxy") }) {
                    throw new GradleException("Vulkan UI JAR is missing Vulkan UI classes")
                }
                if (!openglUiEntries.isEmpty()) {
                    throw new GradleException("Vulkan UI JAR contains OpenGL UI classes: ${openglUiEntries}")
                }
            } else {
                if (!entryNames.contains("com/radiance/client/opengl_ui/OpenGLUiBridge.class")
                    || !entryNames.contains("com/radiance/client/opengl_ui/OpenGLUiProxy.class")) {
                    throw new GradleException("OpenGL UI JAR is missing OpenGL UI classes")
                }
                if (!vulkanUiEntries.isEmpty()) {
                    throw new GradleException("OpenGL UI JAR contains Vulkan UI classes: ${vulkanUiEntries}")
                }

                def mixinEntry = zip.getEntry("radiance.mixins.json")
                if (mixinEntry == null) {
                    throw new GradleException("OpenGL UI JAR is missing radiance.mixins.json")
                }
                def mixinConfig = new JsonSlurper().parseText(
                    new String(zip.getInputStream(mixinEntry).bytes,
                        java.nio.charset.StandardCharsets.UTF_8))
                def configuredMixins = (mixinConfig.mixins ?: []) + (mixinConfig.client ?: [])
                def forbiddenMixins = configuredMixins.findAll {
                    openglExcludedMixins.contains(it)
                }
                if (!forbiddenMixins.isEmpty()) {
                    throw new GradleException(
                        "OpenGL UI JAR enables Vulkan UI mixins: ${forbiddenMixins}")
                }
            }

            def nativeEntry = zip.getEntry(nativeLibraryName)
            if (nativeEntry == null) {
                throw new GradleException("JAR does not contain ${nativeLibraryName}")
            }
            def nativeContents = new String(zip.getInputStream(nativeEntry).bytes,
                java.nio.charset.StandardCharsets.ISO_8859_1)
            def hasAllNativeVulkanUiMarkers =
                nativeVulkanUiMarkers.every { nativeContents.contains(it) }
            def hasAnyNativeVulkanUiMarker =
                nativeVulkanUiMarkers.any { nativeContents.contains(it) }
            def hasAllNativeOpenGLUiMarkers =
                nativeOpenGLUiMarkers.every { nativeContents.contains(it) }
            def hasAnyNativeOpenGLUiMarker =
                nativeOpenGLUiMarkers.any { nativeContents.contains(it) }
            if (vulkanUiBackend
                && (!hasAllNativeVulkanUiMarkers || hasAnyNativeOpenGLUiMarker)) {
                throw new GradleException("Packaged native UI backend does not match radianceUiBackend=vulkan")
            }
            if (openGLUiBackend
                && (!hasAllNativeOpenGLUiMarkers || hasAnyNativeVulkanUiMarker)) {
                throw new GradleException("Packaged native UI backend does not match radianceUiBackend=opengl")
            }
        }
    }
}

tasks.named("build") {
    dependsOn tasks.named("verifyProfilerPackaging")
    dependsOn tasks.named("verifyUiBackendPackaging")
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
