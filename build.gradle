}

["331": "3.3.1", "332": "3.3.2"].each { suffix, dhVersion ->
    def compatibilityCheck = tasks.register("checkDistantHorizons${suffix}", JavaExec) {
        classpath = sourceSets.dhCompatibilityTest.output + sourceSets.main.output +
            sourceSets.distantHorizons332.output +
            sourceSets.main.compileClasspath.filter { !it.name.toLowerCase(Locale.ROOT).contains("distanthorizons") } +
            (suffix == "331" ? configurations.distantHorizons331TestRuntime :
                configurations.distantHorizons332CompileClasspath)
        mainClass = "com.radiance.client.mod_support.distant_horizons.DistantHorizonsCompatibilityCheck"
        args dhVersion
        jvmArgs "-Xverify:all"
    }
    tasks.named("check") { dependsOn compatibilityCheck }
}


tasks.register("verifyDistantHorizonsPackaging") {
    dependsOn tasks.named("remapJar")
    doLast {
        def outputJar = tasks.named("remapJar").get().archiveFile.get().asFile
        new ZipFile(outputJar).withCloseable { zip ->
            ["331", "332"].each { suffix ->
                def adapter = "com/radiance/client/mod_support/distant_horizons/DistantHorizonsRenderApi${suffix}.class"
                if (zip.getEntry(adapter) == null) {
                    throw new GradleException("Missing Distant Horizons adapter: ${adapter}")
                }
            }
            if (zip.entries().any { it.name.startsWith("com/seibel/distanthorizons/")
                    || it.name.endsWith("DistantHorizonsCompatibilityCheck.class") }) {
                throw new GradleException("DH dependencies or compatibility tests were bundled into the mod")
            }
        }
    }
}

tasks.named("check") { dependsOn tasks.named("verifyDistantHorizonsPackaging") }
