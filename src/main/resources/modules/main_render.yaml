name: "render_pipeline.module.main_render.name"
inputImageConfigs: [ ]
outputImageConfigs:
  - name: "radiance"
    format: "R16G16B16A16_SFLOAT"
  - name: "diffuse_albedo_metallic"
    format: "R8G8B8A8_UNORM"
  - name: "specular_albedo"
    format: "R8G8B8A8_UNORM"
  - name: "normal_roughness"
    format: "R16G16B16A16_SFLOAT"
  - name: "motion_vector"
    format: "R16G16_SFLOAT"
  - name: "linear_depth"
    format: "R16_SFLOAT"
  - name: "first_hit_depth"
    format: "R16_SFLOAT"
  - name: "indirect_specular_hit_distance"
    format: "R16_SFLOAT"
  - name: "indirect_diffuse_hit_distance"
    format: "R16_SFLOAT"
  - name: "indirect_diffuse_radiance"
    format: "R16G16B16A16_SFLOAT"
  - name: "indirect_diffuse_direction"
    format: "R16G16B16A16_SFLOAT"
  - name: "indirect_specular_radiance"
    format: "R16G16B16A16_SFLOAT"
  - name: "indirect_specular_direction"
    format: "R16G16B16A16_SFLOAT"
  - name: "first_hit_clear"
    format: "R16G16B16A16_SFLOAT"
  - name: "first_hit_refraction"
    format: "R16G16B16A16_SFLOAT"
  - name: "first_hit_base_emission"
    format: "R16G16B16A16_SFLOAT"
  - name: "fog_image"
    format: "R16G16B16A16_SFLOAT"
  - name: "direct_diffuse_radiance"
    format: "R16G16B16A16_SFLOAT"
  - name: "direct_specular_radiance"
    format: "R16G16B16A16_SFLOAT"
  - name: "direct_hit_distance"
    format: "R16_SFLOAT"
  - name: "direct_light_guide_normal_roughness"
    format: "R16G16B16A16_SFLOAT"
  - name: "direct_light_guide_motion_depth"
    format: "R16G16B16A16_SFLOAT"
attributeConfigs:
  - name: "render_pipeline.module.main_render.attribute.shader_pack_path"
    group: "settings.group.general"
    performanceImpact: "low"
    type: "string"
    value: "shaders/world/ray_tracing/advanced.zip"
  - name: "render_pipeline.module.main_render.attribute.use_jitter"
    group: "settings.group.quality"
    performanceImpact: "low"
    type: "bool"
    value: "render_pipeline.true"
  - name: "render_pipeline.module.main_render.attribute.use_sharc"
    group: "settings.group.sharc"
    performanceImpact: "medium"
    type: "bool"
    value: "render_pipeline.true"
  - name: "render_pipeline.module.main_render.attribute.sharc_resolve_frame_stride"
    group: "settings.group.sharc"
    performanceImpact: "medium"
    type: "int_range:1-16"
    value: "1"
