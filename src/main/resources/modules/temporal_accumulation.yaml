name: "render_pipeline.module.temporal_accumulation.name"
inputImageConfigs:
  - name: "color"
    format: "R16G16B16A16_SFLOAT"
  - name: "motion"
    format: "R16G16_SFLOAT"
  - name: "normal_roughness"
    format: "R16G16B16A16_SFLOAT"
  - name: "linear_depth"
    format: "R16_SFLOAT"
outputImageConfigs:
  - name: "accumulated_radiance"
    format: "R16G16B16A16_SFLOAT"
attributeConfigs:
  - name: "render_pipeline.module.temporal_accumulation.attribute.alpha"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.01-1.0"
    value: "0.12"
  - name: "render_pipeline.module.temporal_accumulation.attribute.depth_threshold"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.0-1.0"
    value: "0.05"
  - name: "render_pipeline.module.temporal_accumulation.attribute.depth_scale"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.0-0.1"
    value: "0.015"
