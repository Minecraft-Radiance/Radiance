name: "render_pipeline.module.nrd.name"
inputImageConfigs:
  # Direct lighting, denoised by RELAX.
  - name: "direct_diffuse_radiance"
    format: "R16G16B16A16_SFLOAT"
  - name: "direct_specular_radiance"
    format: "R16G16B16A16_SFLOAT"
  - name: "direct_hit_distance"
    format: "R16_SFLOAT"
  - name: "direct_light_guide_normal_roughness"
    format: "R16G16B16A16_SFLOAT"
  - name: "direct_light_guide_motion_depth"
    format: "R16G16B16A16_SFLOAT"

  # Indirect lighting, denoised by REBLUR.
  - name: "indirect_diffuse_radiance"
    format: "R16G16B16A16_SFLOAT"
  - name: "indirect_specular_radiance"
    format: "R16G16B16A16_SFLOAT"
  - name: "indirect_diffuse_direction"
    format: "R16G16B16A16_SFLOAT"
  - name: "indirect_specular_direction"
    format: "R16G16B16A16_SFLOAT"
  - name: "indirect_diffuse_hit_distance"
    format: "R16_SFLOAT"
  - name: "indirect_specular_hit_distance"
    format: "R16_SFLOAT"
  - name: "indirect_guide_normal_roughness"
    format: "R16G16B16A16_SFLOAT"
  - name: "indirect_guide_motion"
    format: "R16G16_SFLOAT"
  - name: "indirect_guide_depth"
    format: "R16_SFLOAT"

  # Material data shared by direct and indirect signal preparation/composition.
  - name: "shared_diffuse_albedo_metallic"
    format: "R8G8B8A8_UNORM"
  - name: "shared_specular_albedo"
    format: "R8G8B8A8_UNORM"

  # Data used only when composing the denoised signals into final radiance.
  - name: "compose_clear_radiance"
    format: "R16G16B16A16_SFLOAT"
  - name: "compose_base_emission"
    format: "R16G16B16A16_SFLOAT"
  - name: "compose_fog"
    format: "R16G16B16A16_SFLOAT"
outputImageConfigs:
  - name: "denoised_radiance"
    format: "R16G16B16A16_SFLOAT"
attributeConfigs:
  - name: "render_pipeline.module.nrd.attribute.enable_sh"
    group: "settings.group.denoising"
    performanceImpact: "high"
    type: "bool"
    value: "render_pipeline.false"
  - name: "render_pipeline.module.nrd.attribute.enable_separate_direct_denoising"
    group: "settings.group.denoising"
    performanceImpact: "high"
    type: "bool"
    value: "render_pipeline.true"
  - name: "render_pipeline.module.nrd.attribute.max_accumulated_frame_num"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "int_range:0-63"
    value: "30"
  - name: "render_pipeline.module.nrd.attribute.max_fast_accumulated_frame_num"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "int_range:0-63"
    value: "6"
  - name: "render_pipeline.module.nrd.attribute.max_stabilized_frame_num"
    group: "settings.group.temporal_response"
    performanceImpact: "medium"
    type: "int_range:0-63"
    value: "30"
  - name: "render_pipeline.module.nrd.attribute.history_fix_frame_num"
    group: "settings.group.temporal_response"
    performanceImpact: "medium"
    type: "int_range:0-3"
    value: "3"
  - name: "render_pipeline.module.nrd.attribute.history_fix_base_pixel_stride"
    group: "settings.group.temporal_response"
    performanceImpact: "medium"
    type: "int_range:1-32"
    value: "14"
  - name: "render_pipeline.module.nrd.attribute.history_fix_alternate_pixel_stride"
    group: "settings.group.temporal_response"
    performanceImpact: "medium"
    type: "int_range:1-32"
    value: "14"
  - name: "render_pipeline.module.nrd.attribute.fast_history_clamping_sigma_scale"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "float_range:1.0-3.0"
    value: "2.0"
  - name: "render_pipeline.module.nrd.attribute.responsive_roughness_threshold"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "float_range:0.0-1.0"
    value: "0.08"
  - name: "render_pipeline.module.nrd.attribute.responsive_min_accumulated_frame_num"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "int_range:0-3"
    value: "1"
  - name: "render_pipeline.module.nrd.attribute.antilag_luminance_sigma_scale"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "float_range:1.0-5.0"
    value: "2.0"
  - name: "render_pipeline.module.nrd.attribute.antilag_luminance_sensitivity"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "float_range:1.0-5.0"
    value: "1.5"
  - name: "render_pipeline.module.nrd.attribute.min_blur_radius"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.0-10.0"
    value: "1.0"
  - name: "render_pipeline.module.nrd.attribute.max_blur_radius"
    group: "settings.group.denoising"
    performanceImpact: "medium"
    type: "float_range:0.0-80.0"
    value: "30.0"
  - name: "render_pipeline.module.nrd.attribute.indirect_specular_prepass_blur_radius"
    group: "settings.group.denoising"
    performanceImpact: "high"
    type: "float_range:0.0-80.0"
    value: "20.0"
  - name: "render_pipeline.module.nrd.attribute.min_hit_distance_weight"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.001-0.2"
    value: "0.1"
  - name: "render_pipeline.module.nrd.attribute.lobe_angle_fraction"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.0-1.0"
    value: "0.15"
  - name: "render_pipeline.module.nrd.attribute.roughness_fraction"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.0-1.0"
    value: "0.15"
  - name: "render_pipeline.module.nrd.attribute.plane_distance_sensitivity"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.0-0.2"
    value: "0.02"
  - name: "render_pipeline.module.nrd.attribute.specular_probability_threshold_low"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.0-1.0"
    value: "0.5"
  - name: "render_pipeline.module.nrd.attribute.specular_probability_threshold_high"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.0-1.0"
    value: "0.9"
  - name: "render_pipeline.module.nrd.attribute.firefly_suppressor_min_relative_scale"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:1.0-3.0"
    value: "2.0"
  - name: "render_pipeline.module.nrd.attribute.enable_anti_firefly"
    group: "settings.group.denoising"
    performanceImpact: "medium"
    type: "bool"
    value: "render_pipeline.true"
  - name: "render_pipeline.module.nrd.attribute.indirect_hit_distance_reconstruction_mode"
    group: "settings.group.denoising"
    performanceImpact: "high"
    type: "enum:off-3x3-5x5"
    value: "3x3"
  - name: "render_pipeline.module.nrd.attribute.direct_diffuse_max_accumulated_frame_num"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "int_range:0-63"
    value: "30"
  - name: "render_pipeline.module.nrd.attribute.direct_specular_max_accumulated_frame_num"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "int_range:0-63"
    value: "12"
  - name: "render_pipeline.module.nrd.attribute.direct_diffuse_max_fast_accumulated_frame_num"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "int_range:0-63"
    value: "6"
  - name: "render_pipeline.module.nrd.attribute.direct_specular_max_fast_accumulated_frame_num"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "int_range:0-63"
    value: "4"
  - name: "render_pipeline.module.nrd.attribute.direct_history_fix_frame_num"
    group: "settings.group.temporal_response"
    performanceImpact: "medium"
    type: "int_range:0-3"
    value: "3"
  - name: "render_pipeline.module.nrd.attribute.direct_fast_history_clamping_sigma_scale"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "float_range:1.0-3.0"
    value: "1.35"
  - name: "render_pipeline.module.nrd.attribute.direct_antilag_acceleration_amount"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "float_range:0.0-1.0"
    value: "0.3"
  - name: "render_pipeline.module.nrd.attribute.direct_antilag_reset_amount"
    group: "settings.group.temporal_response"
    performanceImpact: "low"
    type: "float_range:0.0-1.0"
    value: "0.5"
  - name: "render_pipeline.module.nrd.attribute.direct_diffuse_prepass_blur_radius"
    group: "settings.group.denoising"
    performanceImpact: "high"
    type: "float_range:0.0-80.0"
    value: "0.0"
  - name: "render_pipeline.module.nrd.attribute.direct_specular_prepass_blur_radius"
    group: "settings.group.denoising"
    performanceImpact: "high"
    type: "float_range:0.0-80.0"
    value: "0.0"
  - name: "render_pipeline.module.nrd.attribute.direct_min_hit_distance_weight"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "float_range:0.0-0.2"
    value: "0.05"
  - name: "render_pipeline.module.nrd.attribute.direct_hit_distance_reconstruction_mode"
    group: "settings.group.denoising"
    performanceImpact: "high"
    type: "enum:off-3x3-5x5"
    value: "3x3"
  - name: "render_pipeline.module.nrd.attribute.direct_enable_anti_firefly"
    group: "settings.group.denoising"
    performanceImpact: "medium"
    type: "bool"
    value: "render_pipeline.true"
  - name: "render_pipeline.module.nrd.attribute.return_history_length_instead_of_occlusion"
    group: "settings.group.denoising"
    performanceImpact: "low"
    type: "bool"
    value: "render_pipeline.false"
