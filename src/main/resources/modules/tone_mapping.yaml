name: "render_pipeline.module.tone_mapping.name"
inputImageConfigs:
  - name: "denoised_radiance"
    format: "R16G16B16A16_SFLOAT"
outputImageConfigs:
  - name: "mapped_output"
    format: "R8G8B8A8_UNORM"
attributeConfigs:
  - name: "render_pipeline.module.tone_mapping.attribute.exposure_ceiling"
    group: "settings.group.exposure"
    performanceImpact: "low"
    type: "float_range:0.0-4.0"
    value: "2.25"
    visibleWhen:
      - attribute: "render_pipeline.module.tone_mapping.attribute.manual_exposure"
        values:
          - "render_pipeline.false"
  - name: "render_pipeline.module.tone_mapping.attribute.target_luminance"
    group: "settings.group.exposure"
    performanceImpact: "low"
    type: "float_range:0.01-3.2"
    value: "0.8"
  - name: "render_pipeline.module.tone_mapping.attribute.metering_response"
    group: "settings.group.exposure"
    performanceImpact: "low"
    type: "float_range:0.1-9.0"
    value: "3.0"
    visibleWhen:
      - attribute: "render_pipeline.module.tone_mapping.attribute.manual_exposure"
        values:
          - "render_pipeline.false"
  - name: "render_pipeline.module.tone_mapping.attribute.include_sky_in_meter"
    group: "settings.group.exposure"
    performanceImpact: "low"
    type: "bool"
    value: "render_pipeline.true"
  - name: "render_pipeline.module.tone_mapping.attribute.sky_meter_weight"
    group: "settings.group.exposure"
    performanceImpact: "low"
    type: "float_range:0.0-6.0"
    value: "2.0"
    visibleWhen:
      - attribute: "render_pipeline.module.tone_mapping.attribute.include_sky_in_meter"
        values:
          - "render_pipeline.true"
  - name: "render_pipeline.module.tone_mapping.attribute.include_emissive_in_meter"
    group: "settings.group.exposure"
    performanceImpact: "low"
    type: "bool"
    value: "render_pipeline.true"
  - name: "render_pipeline.module.tone_mapping.attribute.emissive_meter_weight"
    group: "settings.group.exposure"
    performanceImpact: "low"
    type: "float_range:0.0-4.0"
    value: "1.0"
    visibleWhen:
      - attribute: "render_pipeline.module.tone_mapping.attribute.include_emissive_in_meter"
        values:
          - "render_pipeline.true"
  - name: "render_pipeline.module.tone_mapping.attribute.allow_negative_exposure"
    group: "settings.group.exposure"
    performanceImpact: "low"
    type: "bool"
    value: "render_pipeline.false"
    visibleWhen:
      - attribute: "render_pipeline.module.tone_mapping.attribute.manual_exposure"
        values:
          - "render_pipeline.false"
  - name: "render_pipeline.module.tone_mapping.attribute.manual_exposure"
    group: "settings.group.exposure"
    performanceImpact: "low"
    type: "bool"
    value: "render_pipeline.false"
  - name: "render_pipeline.module.tone_mapping.attribute.manual_exposure_ev"
    group: "settings.group.exposure"
    performanceImpact: "low"
    type: "float_range:0.0-14.0"
    value: "4.5"
    visibleWhen:
      - attribute: "render_pipeline.module.tone_mapping.attribute.manual_exposure"
        values:
          - "render_pipeline.true"
  - name: "render_pipeline.module.tone_mapping.attribute.chroma_preservation"
    group: "settings.group.tone_mapping"
    performanceImpact: "low"
    type: "float_range:0.0-2.0"
    value: "0.515"
  - name: "render_pipeline.module.tone_mapping.attribute.output_contrast_range"
    group: "settings.group.tone_mapping"
    performanceImpact: "low"
    type: "float_range:0.5-24.0"
    value: "6.5"
  - name: "render_pipeline.module.tone_mapping.attribute.shadow_detail_floor"
    group: "settings.group.tone_mapping"
    performanceImpact: "low"
    type: "float_range:0.0-1.0"
    value: "0.02"
  - name: "render_pipeline.module.tone_mapping.attribute.shadow_contrast"
    group: "settings.group.tone_mapping"
    performanceImpact: "low"
    type: "float_range:0.0-4.0"
    value: "0.0"
  - name: "render_pipeline.module.tone_mapping.attribute.shadow_pivot"
    group: "settings.group.tone_mapping"
    performanceImpact: "low"
    type: "float_range:-24.0-0.0"
    value: "-8.0"
  - name: "render_pipeline.module.tone_mapping.attribute.output_offset_ev"
    group: "settings.group.tone_mapping"
    performanceImpact: "low"
    type: "float_range:-8.0-8.0"
    value: "0.0"
  - name: "render_pipeline.module.tone_mapping.attribute.curve_lift_limit"
    group: "settings.group.tone_mapping"
    performanceImpact: "low"
    type: "float_range:0.0-24.0"
    value: "2.75"
