modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0"
issueTrackerURL="https://github.com/Minecraft-Radiance/Radiance/issues"

[[mods]]
modId="radiance"
version="${version}"
displayName="Radiance"
displayURL="https://www.minecraft-radiance.com/"
logoFile="assets/radiance/icon.png"
authors="LJIONG, Interstellarss"
