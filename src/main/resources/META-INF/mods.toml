[[dependencies.radiance]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.radiance]]
modId="distanthorizons"
mandatory=false
versionRange="[3.3.0]"
ordering="NONE"
side="CLIENT"

[[dependencies.radiance]]
modId="flywheel"
mandatory=false
versionRange="[1.0.1,1.0.6-281]"
ordering="NONE"
side="CLIENT"
