modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0"
issueTrackerURL="https://github.com/Minecraft-Radiance/Radiance/issues"

[[mods]]
modId="radiance"
version="${mod_version}"
displayName="Radiance"
displayURL="https://www.minecraft-radiance.com/"
logoFile="assets/radiance/icon.png"
authors="LJIONG, Interstellarss"
displayTest="IGNORE_ALL_VERSION"
description='''
A Minecraft mod that uses modern Vulkan C++ as its backend renderer.
'''

[[mixins]]
config="radiance.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.radiance]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.radiance]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.radiance]]
modId="distanthorizons"
type="optional"
versionRange="[3.3.1]"
ordering="NONE"
side="CLIENT"
